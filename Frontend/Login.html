<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - InvoXpress</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-left">
      <img src="images/Logo.jpg" alt="Logo InvoXpress" class="login-logo" />
      <h1>Bienvenido a <span>InvoXpress</span></h1>
      <p class="login-subtitle">Ingresa tus datos para comenzar</p>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required />
        </div>

        <div class="input-group">
          <label for="contraseña">Contraseña</label>
          <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña" required />
        </div>

        <div class="form-links">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login">Iniciar sesión</button>

        <div id="g_id_onload"
             data-client_id="622451075968-67jo8p6athvhp372qte6qo5605edelh3.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>

        <p class="register-text">¿No tienes cuenta? <a id="goToRegister">Regístrate</a></p>
      </form>
    </div>

    <div class="login-right">
      <img src="images/imagen_login.jpg" alt="Imagen de fondo" class="login-bg" />
    </div>
  </div>

  <script src="js/login.js"></script>
  <script>
    window.onload = function () {
      document.getElementById("correo").value = "";
      document.getElementById("contraseña").value = "";
    };

    document.getElementById("goToRegister").addEventListener("click", (e) => {
      e.preventDefault();
      document.body.classList.add("slide-page");
      setTimeout(() => {
        window.location.href = "registro.html";
      }, 600);
    });
  </script>
</body>
</html>
